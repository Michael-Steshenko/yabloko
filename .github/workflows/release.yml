# Every push to main builds the Windows package and publishes it as a GitHub release. Work happens on dev; merging dev into main is what releases.
#
# Version: major.minor from package.json, patch = this workflow's run number (v0.1.7).
# Release notes: the subject line of every commit since the previous release.
#
# Windows builds are VMP-signed with castlabs EVS, which needs the repository secrets
# EVS_ACCOUNT_NAME and EVS_PASSWD (the EVS account used for `npm run sign:dev`).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, in push order
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    # Windows only for now: Linux builds come once they've been tested
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Set version
        shell: bash
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: npm ci

      - name: Log in to castlabs EVS
        shell: bash
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          EVS_NO_ASK: "1"
        run: |
          if [ -z "$EVS_ACCOUNT_NAME" ] || [ -z "$EVS_PASSWD" ]; then
            echo "::error::Set the EVS_ACCOUNT_NAME and EVS_PASSWD repository secrets"
            exit 1
          fi
          python -m pip install --upgrade castlabs-evs
          python -m castlabs_evs.account reauth

      # electron-builder publishes on its own when it sees a GitHub token; the release
      # job below does that instead
      - name: Build
        run: npm run dist -- --publish never

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/win-unpacked/* -DestinationPath "dist/Yabloko-$env:VERSION-win-x64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          if-no-files-found: error
          path: dist/*.zip

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags and history, for the release notes
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Write release notes
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          range=${previous:+$previous..}HEAD
          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s' "$range"
            if [ -n "$previous" ]; then
              echo
              echo "**Full changelog:** https://github.com/${{ github.repository }}/compare/$previous...v$VERSION"
            fi
          } > notes.md
          cat notes.md

      - name: Publish release
        run: |
          gh release create "v$VERSION" artifacts/* \
            --target "${{ github.sha }}" \
            --title "Yabloko $VERSION" \
            --notes-file notes.md
